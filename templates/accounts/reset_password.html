{% extends 'base.html' %}

{% block title %}Reset Password - Placement Portal{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 40px auto; width: 100%;">
    <div class="card" style="padding: 32px; box-shadow: var(--shadow-md);">
        <h2>Set New Password</h2>
        <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 24px;">Confirm your new password details below.</p>
        
        <form method="POST" action="" onsubmit="alert('Your password has been reset successfully.'); window.location.href='{% url 'accounts:login' %}'; return false;">
            {% csrf_token %}
            <div class="form-group">
                <label>New Password</label>
                <input type="password" class="form-control" placeholder="New password" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" class="form-control" placeholder="Confirm password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}

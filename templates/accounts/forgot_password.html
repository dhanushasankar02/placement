{% extends 'base.html' %}

{% block title %}Forgot Password - Placement Portal{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 40px auto; width: 100%;">
    <div class="card" style="padding: 32px; box-shadow: var(--shadow-md); text-align: center;">
        <i class="fa-solid fa-lock" style="font-size: 40px; color: var(--primary); margin-bottom: 16px;"></i>
        <h2>Forgot Password</h2>
        <p style="color: var(--text-muted); font-size: 13px; line-height: 1.5; margin-top: 8px; margin-bottom: 24px;">No worries! Enter your registered email address and we will send you a password reset link.</p>
        
        <form method="POST" action="" onsubmit="alert('A password reset link has been dispatched to your email address.'); window.location.href='{% url 'accounts:login' %}'; return false;">
            {% csrf_token %}
            <div class="form-group" style="text-align: left;">
                <label>Email Address</label>
                <input type="email" class="form-control" placeholder="Enter your email" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Send Reset Link</button>
        </form>
        
        <div style="margin-top: 24px; font-size: 13px;">
            <a href="{% url 'accounts:login' %}" style="font-weight: 600;"><i class="fa-solid fa-arrow-left"></i> Back to login</a>
        </div>
    </div>
</div>
{% endblock %}
